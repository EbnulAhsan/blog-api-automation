<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="55%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="pen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="6" fill="url(#accent)"/>

  <!-- Decorative dot grid -->
  <g fill="#334155" opacity="0.5">
    <circle cx="1080" cy="40" r="2.5"/>
    <circle cx="1110" cy="40" r="2.5"/>
    <circle cx="1140" cy="40" r="2.5"/>
    <circle cx="1080" cy="70" r="2.5"/>
    <circle cx="1110" cy="70" r="2.5"/>
    <circle cx="1140" cy="70" r="2.5"/>
  </g>

  <!-- Emblem: document / API node -->
  <g transform="translate(70,55)">
    <rect x="0" y="0" width="150" height="150" rx="28" fill="#0b1220" stroke="url(#accent)" stroke-width="2.5"/>
    <!-- stacked blog lines -->
    <rect x="30" y="34" width="90" height="10" rx="5" fill="#e2e8f0"/>
    <rect x="30" y="54" width="90" height="8" rx="4" fill="#94a3b8"/>
    <rect x="30" y="68" width="60" height="8" rx="4" fill="#94a3b8"/>
    <!-- API brackets -->
    <path d="M28 100 L14 116 L28 132" stroke="url(#pen)" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M122 100 L136 116 L122 132" stroke="url(#pen)" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="75" cy="116" r="6" fill="#f97316"/>
    <!-- shield/lock accent -->
    <path d="M108 8 h26 a10 10 0 0 1 10 10 v10 a24 24 0 0 1 -23 24 a24 24 0 0 1 -23 -24 v-10 a10 10 0 0 1 10 -10 z" fill="#0b1220" stroke="#38bdf8" stroke-width="2"/>
    <rect x="112" y="26" width="18" height="12" rx="3" fill="#38bdf8"/>
  </g>

  <!-- Title block -->
  <g transform="translate(255,70)">
    <text x="0" y="46" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="700" fill="#f8fafc">Blog Management API</text>
    <text x="0" y="84" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#94a3b8">Node.js &#183; Express &#183; MySQL &#183; JWT Auth &#183; Postman/Newman Test Automation</text>
    <rect x="2" y="102" width="760" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="0" y="134" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#64748b">Secure REST API with role-based access control and automated HTML test reporting</text>
  </g>
</svg>
